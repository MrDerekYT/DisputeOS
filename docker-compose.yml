# Local PostgreSQL for development and tests:  docker compose up -d
# Then: DATABASE_URL=postgres://disputeos:disputeos@localhost:5432/disputeos_dev  npm run db:migrate
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: disputeos
      POSTGRES_PASSWORD: disputeos
      POSTGRES_DB: disputeos_dev
    ports: ['5432:5432']
    volumes: ['dbdata:/var/lib/postgresql/data', './scripts/docker-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U disputeos']
      interval: 5s
      retries: 10
volumes:
  dbdata:
