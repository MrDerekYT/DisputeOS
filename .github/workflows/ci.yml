name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: disputeos
          POSTGRES_PASSWORD: disputeos
          POSTGRES_DB: disputeos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U disputeos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://disputeos:disputeos@localhost:5432/disputeos_test
      DATABASE_URL_TEST: postgres://disputeos:disputeos@localhost:5432/disputeos_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The CI role is a superuser (postgres image default for POSTGRES_USER), so it may create disputeos_rls.
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          APP_ENV: development
